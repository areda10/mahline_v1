name: MAHLINE PHP Quality

on:
  push:
    branches:
      - feature/Marketplace
  pull_request:
    branches:
      - main

concurrency:
  group: mahline-php-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mahline_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: mahline_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, tokenizer, xml, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Format PHP files changed since Inventory baseline
        env:
          PINT_BASE: 72e27c4b32aefd09c2118e631f2aec0433627e84
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMRT "$PINT_BASE"...HEAD -- '*.php')
          if [ -n "$FILES" ]; then
            printf '%s\n' "$FILES" | xargs -r php vendor/bin/pint
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'style: format PHP files changed since Inventory baseline [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Run Orders integration tests
        run: php artisan test tests/Feature/Domains/Orders

      - name: Run Inventory integration tests
        run: php artisan test tests/Feature/Domains/Inventory

      - name: Run Sales integration tests
        run: php artisan test tests/Feature/Domains/Sales

      - name: Run full Laravel feature suite
        run: php artisan test tests/Feature

      - name: Run Identity authentication workflow framework tests
        run: php artisan test tests/Framework/Domains/Identity/Authentication/Workflows

      - name: Verify changed PHP code style
        if: always()
        env:
          PINT_BASE: 72e27c4b32aefd09c2118e631f2aec0433627e84
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMRT "$PINT_BASE"...HEAD -- '*.php')
          if [ -n "$FILES" ]; then
            printf '%s\n' "$FILES" | xargs -r php vendor/bin/pint --test
          fi
